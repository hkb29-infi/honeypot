<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis Edge SOC</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071016;
      --panel: #0d1b24;
      --line: #1c3542;
      --text: #e8f1f5;
      --muted: #8ca6b2;
      --cyan: #54d6df;
      --red: #ff6b77;
      --yellow: #f5c96a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 85% 0, #123746 0, var(--bg) 42%);
      color: var(--text);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    main { max-width: 1440px; margin: auto; padding: 32px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 28px; }
    h1 { margin: 0; font: 700 32px/1.1 system-ui, sans-serif; letter-spacing: -.04em; }
    h1 span { color: var(--cyan); }
    .status { color: var(--cyan); }
    .status::before { content: "●"; margin-right: 8px; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 14px; }
    .card, .panel { background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--line); border-radius: 12px; }
    .card { padding: 18px; }
    .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; }
    .value { display: block; color: var(--cyan); font-size: 30px; font-weight: 700; margin-top: 4px; }
    .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(300px, .6fr); gap: 14px; }
    .panel { overflow: hidden; }
    .panel h2 { font: 600 16px system-ui, sans-serif; padding: 16px 18px; margin: 0; border-bottom: 1px solid var(--line); }
    .events { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
    td { font-size: 12px; }
    .threat { color: var(--red); font-weight: 700; }
    .path { color: var(--yellow); }
    .badge { display: inline-block; padding: 3px 7px; margin: 2px; border: 1px solid #2d5866; border-radius: 99px; color: var(--cyan); font-size: 10px; }
    pre { min-height: 220px; max-height: 420px; overflow: auto; padding: 18px; margin: 0; color: #b7e9d0; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
    .empty { color: var(--muted); padding: 24px; }
    @media (max-width: 800px) {
      main { padding: 18px; }
      header { align-items: start; flex-direction: column; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1><span>AEGIS</span> EDGE / SOC</h1><div class="label">Edge deception telemetry console</div></div>
      <div class="status" id="status">LIVE · polling every 2s</div>
    </header>
    <section class="stats">
      <div class="card"><span class="label">Trapped attacks</span><strong class="value" id="total">0</strong></div>
      <div class="card"><span class="label">Highest threat</span><strong class="value" id="highest">0</strong></div>
      <div class="card"><span class="label">Unique IPs</span><strong class="value" id="ips">0</strong></div>
      <div class="card"><span class="label">Last event</span><strong class="value" id="last">—</strong></div>
    </section>
    <section class="layout">
      <div class="panel">
        <h2>Intercepted activity</h2>
        <div class="events">
          <table>
            <thead><tr><th>Time</th><th>Source</th><th>Probe</th><th>Score</th><th>Triggers</th></tr></thead>
            <tbody id="events"><tr><td class="empty" colspan="5">Waiting for telemetry…</td></tr></tbody>
          </table>
        </div>
      </div>
      <div class="panel">
        <h2>Latest decoy payload</h2>
        <pre id="payload">Waiting for intercepted request…</pre>
      </div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    let latestId = 0;
    function render(rows) {
      const uniqueIps = new Set(rows.map((row) => row.ip)).size;
      $('total').textContent = rows.length;
      $('highest').textContent = rows.reduce((max, row) => Math.max(max, row.threat_score || 0), 0);
      $('ips').textContent = uniqueIps;
      $('last').textContent = rows[0] ? new Date(`${rows[0].timestamp}Z`).toLocaleTimeString() : '—';
      $('events').innerHTML = rows.length ? rows.map((row) => `
        <tr>
          <td>${escapeHtml(new Date(`${row.timestamp}Z`).toLocaleTimeString())}</td>
          <td>${escapeHtml(row.ip)} / ${escapeHtml(row.country || 'XX')}</td>
          <td class="path">${escapeHtml(row.method)} ${escapeHtml(row.path)}</td>
          <td class="threat">${escapeHtml(row.threat_score)}</td>
          <td>${String(row.reason || '').split('; ').map((reason) => `<span class="badge">${escapeHtml(reason)}</span>`).join('')}</td>
        </tr>`).join('') : '<tr><td class="empty" colspan="5">No attacks recorded yet.</td></tr>';
      if (rows[0] && rows[0].id !== latestId) {
        latestId = rows[0].id;
        try { $('payload').textContent = JSON.stringify(JSON.parse(rows[0].decoy_served), null, 2); }
        catch { $('payload').textContent = rows[0].decoy_served || 'No payload captured'; }
      }
    }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
    }
    async function poll() {
      try {
        const response = await fetch('/_aegis/stats', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        render((await response.json()).intercepted || []);
        $('status').textContent = 'LIVE · updated ' + new Date().toLocaleTimeString();
      } catch (error) {
        $('status').textContent = 'OFFLINE · ' + error.message;
      }
    }
    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
